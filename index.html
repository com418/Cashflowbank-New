<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Shatter Effect</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        h1:hover {
            color: #ff4757;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #3742fa;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #2f3542;
        }

        / Particle styles /
        .particle {
            position: absolute;
            pointer-events: none;
            background: #ff4757;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">Click Me to Shatter</h1>
        <button class="btn" id="destroyBtn">Destroy This Button</button>
    </div>

    <script>
        function createShatterEffect(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Hide original element
            element.style.visibility = 'hidden';

            // Create particles
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size
                const size = Math.random()  10 + 5;
                particle.style.width = ${size}px;
                particle.style.height = ${size}px;
                
                // Start at center of element
                particle.style.left = ${centerX}px;
                particle.style.top = ${centerY}px;
                
                document.body.appendChild(particle);

                // Animate
                const angle = Math.random()  Math.PI  2;
                const velocity = Math.random()  100 + 50;
                const tx = Math.cos(angle)  velocity;
                const ty = Math.sin(angle)  velocity;

                particle.animate([
                    { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
                    { transform: translate(${tx}px, ${ty}px) rotate(${Math.random() * 360}deg), opacity: 0 }
                ], {
                    duration: 800,
                    easing: 'cubic-bezier(0, .9, .57, 1)',
                    fill: 'forwards'
                }).onfinish = () => particle.remove();
            }

            // Reset after delay
            setTimeout(() => {
                element.style.visibility = 'visible';
            }, 1000);
        }

        // Attach event listeners
        document.getElementById('title').addEventListener('click', function() {
            createShatterEffect(this);
        });

        document.getElementById('destroyBtn').addEventListener('click', function() {
            createShatterEffect(this);
        });
    </script>
</body>
</html>
